<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" rx="16" fill="#181431" />
  <rect x="24" y="24" width="552" height="352" rx="12" fill="#241E47" />
  <!-- Window bar -->
  <rect x="24" y="24" width="552" height="40" rx="12" fill="#322B60" />
  <circle cx="48" cy="44" r="6" fill="#FF5F56" />
  <circle cx="68" cy="44" r="6" fill="#FFBD2E" />
  <circle cx="88" cy="44" r="6" fill="#27C93F" />
  <text x="300" y="49" fill="#EDEAFF" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">March Mind — Grade 7 Simulation &amp; Strategy</text>

  <!-- Grid simulation area -->
  <rect x="44" y="80" width="512" height="276" rx="8" fill="#131026" />

  <!-- Isometric / Orthogonal grid tiles -->
  <g stroke="#3928B8" stroke-width="1" stroke-opacity="0.4">
    <line x1="80" y1="120" x2="520" y2="120" />
    <line x1="80" y1="160" x2="520" y2="160" />
    <line x1="80" y1="200" x2="520" y2="200" />
    <line x1="80" y1="240" x2="520" y2="240" />
    <line x1="80" y1="280" x2="520" y2="280" />

    <line x1="140" y1="100" x2="140" y2="300" />
    <line x1="200" y1="100" x2="200" y2="300" />
    <line x1="260" y1="100" x2="260" y2="300" />
    <line x1="320" y1="100" x2="320" y2="300" />
    <line x1="380" y1="100" x2="380" y2="300" />
    <line x1="440" y1="100" x2="440" y2="300" />
  </g>

  <!-- Highlighted path -->
  <rect x="200" y="160" width="60" height="40" fill="#5145E8" fill-opacity="0.6" stroke="#DFFF39" stroke-width="1.5" />
  <rect x="260" y="160" width="60" height="40" fill="#5145E8" fill-opacity="0.6" stroke="#DFFF39" stroke-width="1.5" />
  <rect x="260" y="200" width="60" height="40" fill="#5145E8" fill-opacity="0.6" stroke="#DFFF39" stroke-width="1.5" />
  <rect x="320" y="200" width="60" height="40" fill="#5145E8" fill-opacity="0.6" stroke="#DFFF39" stroke-width="1.5" />

  <!-- Agent token -->
  <circle cx="350" cy="220" r="14" fill="#DFFF39" stroke="#171529" stroke-width="2" />
  <polygon points="346,214 356,220 346,226" fill="#171529" />

  <!-- Simulation metric indicators -->
  <rect x="64" y="96" width="130" height="26" rx="6" fill="#2C264F" />
  <text x="129" y="113" fill="#DFFF39" font-family="monospace" font-size="10" font-weight="600" text-anchor="middle">EPOCH: 48 | ACC: 94%</text>

  <!-- Replaceable badge -->
  <rect x="180" y="320" width="240" height="24" rx="6" fill="#171529" fill-opacity="0.8" stroke="#5145E8" stroke-width="1" />
  <text x="300" y="336" fill="#EDEAFF" font-family="system-ui, sans-serif" font-size="10" font-weight="500" text-anchor="middle">Strategy Simulation • Grade 7</text>
</svg>
