<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" rx="16" fill="#141126" />
  <rect x="24" y="24" width="552" height="352" rx="12" fill="#1E1A38" />
  <!-- Window bar -->
  <rect x="24" y="24" width="552" height="40" rx="12" fill="#2C264F" />
  <circle cx="48" cy="44" r="6" fill="#FF5F56" />
  <circle cx="68" cy="44" r="6" fill="#FFBD2E" />
  <circle cx="88" cy="44" r="6" fill="#27C93F" />
  <text x="300" y="49" fill="#EDEAFF" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">AI Proxy Manager — Grade 7 Architecture</text>

  <!-- Topology visual -->
  <rect x="44" y="80" width="512" height="276" rx="8" fill="#110E21" />

  <!-- Nodes -->
  <!-- Client node -->
  <rect x="70" y="145" width="100" height="60" rx="8" fill="#3928B8" stroke="#5145E8" stroke-width="1.5" />
  <text x="120" y="172" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Client App</text>
  <text x="120" y="190" fill="#EDEAFF" font-family="monospace" font-size="9" text-anchor="middle">:3000</text>

  <!-- Proxy Gateway node -->
  <rect x="240" y="130" width="120" height="90" rx="10" fill="#5145E8" stroke="#DFFF39" stroke-width="2" />
  <text x="300" y="160" fill="#DFFF39" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Proxy Gateway</text>
  <text x="300" y="180" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Rate Limiter</text>
  <text x="300" y="200" fill="#EDEAFF" font-family="monospace" font-size="9" text-anchor="middle">Safe Filter ON</text>

  <!-- Destination Services -->
  <rect x="430" y="105" width="100" height="50" rx="8" fill="#2C264F" stroke="#3928B8" stroke-width="1" />
  <text x="480" y="132" fill="#EDEAFF" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">LLM API 1</text>
  <text x="480" y="146" fill="#DFFF39" font-family="monospace" font-size="9" text-anchor="middle">Active 200</text>

  <rect x="430" y="195" width="100" height="50" rx="8" fill="#2C264F" stroke="#3928B8" stroke-width="1" />
  <text x="480" y="222" fill="#EDEAFF" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Local Cache</text>
  <text x="480" y="236" fill="#DFFF39" font-family="monospace" font-size="9" text-anchor="middle">Hit 88%</text>

  <!-- Connecting Lines -->
  <line x1="170" y1="175" x2="240" y2="175" stroke="#DFFF39" stroke-width="2" stroke-dasharray="4 2" />
  <line x1="360" y1="160" x2="430" y2="130" stroke="#5145E8" stroke-width="2" />
  <line x1="360" y1="190" x2="430" y2="220" stroke="#5145E8" stroke-width="2" />

  <!-- Replaceable badge -->
  <rect x="180" y="320" width="240" height="24" rx="6" fill="#171529" fill-opacity="0.8" stroke="#5145E8" stroke-width="1" />
  <text x="300" y="336" fill="#EDEAFF" font-family="system-ui, sans-serif" font-size="10" font-weight="500" text-anchor="middle">Student Systems Project • Grade 7</text>
</svg>
