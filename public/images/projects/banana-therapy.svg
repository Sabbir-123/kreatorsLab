<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" rx="16" fill="#1B1736" />
  <rect x="24" y="24" width="552" height="352" rx="12" fill="#251F4A" />
  <!-- Window bar -->
  <rect x="24" y="24" width="552" height="40" rx="12" fill="#322B63" />
  <circle cx="48" cy="44" r="6" fill="#FF5F56" />
  <circle cx="68" cy="44" r="6" fill="#FFBD2E" />
  <circle cx="88" cy="44" r="6" fill="#27C93F" />
  <text x="300" y="49" fill="#EDEAFF" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Banana Emotional Therapy — Grades 3–4</text>

  <!-- Chat container -->
  <rect x="44" y="80" width="512" height="276" rx="8" fill="#15122C" />

  <!-- Banana Avatar -->
  <circle cx="110" cy="140" r="38" fill="#5145E8" />
  <!-- Banana shape -->
  <path d="M 95 155 Q 110 165 125 130 Q 130 115 120 120 Q 105 140 95 155 Z" fill="#DFFF39" stroke="#3928B8" stroke-width="2" />
  <circle cx="108" cy="132" r="3" fill="#171529" />
  <circle cx="118" cy="132" r="3" fill="#171529" />
  <path d="M 110 142 Q 114 146 118 142" stroke="#171529" stroke-width="2" stroke-linecap="round" />

  <!-- Chat Bubbles -->
  <rect x="170" y="105" width="340" height="46" rx="12" fill="#3928B8" />
  <text x="185" y="132" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12">"Hi there! How are you feeling after school today?"</text>

  <!-- User reply bubble -->
  <rect x="210" y="170" width="300" height="46" rx="12" fill="#5145E8" />
  <text x="225" y="198" fill="#EDEAFF" font-family="system-ui, sans-serif" font-size="12">"A little tired, but I have a really cool idea."</text>

  <!-- AI banana supportive response -->
  <rect x="170" y="235" width="340" height="54" rx="12" fill="#322B63" stroke="#DFFF39" stroke-width="1.5" />
  <text x="185" y="258" fill="#DFFF39" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Peel-Good Coach:</text>
  <text x="185" y="276" fill="#EDEAFF" font-family="system-ui, sans-serif" font-size="11">"That sounds like inspiration! Want to brainstorm it?"</text>

  <!-- Replaceable badge -->
  <rect x="180" y="320" width="240" height="24" rx="6" fill="#171529" fill-opacity="0.8" stroke="#5145E8" stroke-width="1" />
  <text x="300" y="336" fill="#EDEAFF" font-family="system-ui, sans-serif" font-size="10" font-weight="500" text-anchor="middle">Student Narrative Design • Grades 3–4</text>
</svg>
